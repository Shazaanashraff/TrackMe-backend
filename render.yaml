services:
  - type: web
    name: bus-tracking-backend
    runtime: node
    region: singapore
    startCommand: npm start
    buildCommand: npm ci

    # Render only runs this during deploys (to confirm the new instance came up
    # healthy before cutting traffic) — it does NOT prevent idle spin-down.
    # Free-tier services still sleep after ~15 min with no requests; see
    # docs/CHANGES.md for the keep-alive / cold-start tradeoff.
    healthCheckPath: /health

    # Auto-deploy on git push
    autoDeploy: true

    # Environment variables (set these in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # These must be set in Render dashboard (don't put secrets in this file):
      # MONGODB_URI=<your-mongodb-uri>
      # JWT_SECRET / REFRESH_TOKEN_SECRET / QR_JWT_SECRET / ROOM_KEY_SECRET /
      #   ROOM_KEY_PEPPER / DRIVER_PASSWORD_KEY=<generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))">
      # CLIENT_ORIGINS=<comma-separated-urls, no wildcard in production>

# Recommended Render dashboard setup:
# 1. Create new Web Service
# 2. Connect GitHub repository
# 3. Select branch: main
# 4. Deployment plan: Free
# 5. Environment variables (Dashboard > Environment): see backend/.env.example for
#    the full list. Never set ENABLE_DEV_OTP_ECHO. Shorten ACCESS_TOKEN_EXPIRES_IN
#    from the 7d dev value.

# Free-tier cold start: the service sleeps after ~15 min idle and takes 50s+ to
# wake. A keep-alive ping (e.g. UptimeRobot hitting /health every 5 min) keeps it
# warm, but at that frequency consumes most of the 750 free instance-hours/month
# by itself — evaluate against actual usage before relying on it.
